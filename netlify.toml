# Netlify configuration for ifshhe.com
# Build: `npm run build` renders dist/ (one page per language); only dist/ is published.

[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Redirects
# Canonical host is the apex domain. Netlify does this itself once ifshhe.com is
# the primary domain, but being explicit costs nothing.
[[redirects]]
  from = "https://www.ifshhe.com/*"
  to = "https://ifshhe.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://ifshhe.netlify.app/*"
  to = "https://ifshhe.com/:splat"
  status = 301
  force = true

# Old-style ?lang= links keep working: each language is its own folder now.
[[redirects]]
  from = "/"
  to = "/ar/"
  status = 302
  query = { lang = "ar" }

[[redirects]]
  from = "/"
  to = "/sw/"
  status = 302
  query = { lang = "sw" }

[[redirects]]
  from = "/"
  to = "/ha/"
  status = 302
  query = { lang = "ha" }

# /api/visits is routed by `config.path` inside netlify/functions/visits.mjs.

# ---------------------------------------------------------------------------
# Headers
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# Images, fonts and icons are content-named or change rarely: cache for a year.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS are referenced with ?v=<content hash> (scripts/stamp.mjs), so they can be immutable too.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Thank-you pages (every language) must never be indexed.
[[headers]]
  for = "/thank-you.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*/thank-you.html"
  [headers.values]
    X-Robots-Tag = "noindex"
